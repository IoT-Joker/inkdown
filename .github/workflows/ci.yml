name: CI

# 只在代码或配置变化时跑，避免改文档也触发全量测试。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  workflow_dispatch:

# 同一分支的旧运行自动取消，省时间也省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查与单元测试
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 必须先装 Node：pnpm 由 Node 执行。
      # 顺序颠倒时 action-setup 的自安装脚本拿不到运行时，直接退出码 1
      # —— 这正是上一次 CI 失败的原因。
      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 用精确版本而不是 `11`：宽范围需要联网解析具体版本号，
      # 解析失败时 self-installer 会退出码 1。
      # run_install: false 避免它在装依赖前又跑一次 install。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
          run_install: false

      # 失败时 CI 界面只显示「Process completed with exit code 1」，
      # 看不到真正原因。这里先把环境与配置打印出来，便于定位。
      - name: 环境诊断
        shell: pwsh
        run: |
          Write-Host "--- node / pnpm ---"
          node --version
          pnpm --version
          Write-Host "--- pnpm 生效配置 ---"
          pnpm config list
          Write-Host "--- pnpm-workspace.yaml ---"
          Get-Content pnpm-workspace.yaml
          Write-Host "--- lockfile ---"
          Write-Host (Test-Path pnpm-lock.yaml)

      # 这里不再配 git 的 insteadOf 改写。
      # 早前试过让 git 把 SSH 改写成 HTTPS，但 pnpm 拉 git 依赖时用的是
      # 自己拼的 URL，不经过 git 的 url 重写规则，那一步实际没起作用。
      # 正确做法是锁定文件本身就用 HTTPS（见 pnpm-lock.yaml 的 file-icons）。
      #
      # 用 --frozen-lockfile：CI 上必须保证 lockfile 与 package.json 一致，
      # 否则本地改了依赖却忘记提交 lockfile，会一直用旧版本装出奇怪的组合。
      #
      # 输出同时落到 step summary 与 artifact，失败时还会逐条输出为
      # ::error:: 注解 —— GitHub 默认的 annotations 只有一句
      # 「Process completed with exit code 1」，job logs 接口又要更高权限的
      # token 才读得到，靠它排查只能猜。这套输出是真正定位到本次 CI 失败的
      # 关键（错误行被 pnpm 的进度条回车刷屏盖掉了，所以还要关掉 progress）。
      - name: 安装依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:CI = 'true'
          pnpm install --frozen-lockfile --reporter=append-only --config.progress=false 2>&1 |
            Tee-Object -FilePath install.log
          $code = $LASTEXITCODE
          Write-Host "pnpm install 退出码: $code"
          if ($code -ne 0) {
            # 只挑真正有用的行，避免被进度条噪声淹没
            $keys = 'ERR_|error|Error|ERROR|failed|FATAL|EACCES|ENOENT|ETIMEDOUT|ECONNREFUSED|Cannot find|not found|404|403|401|exit code|outdated|lockfile'
            $errLines = Get-Content install.log |
              Where-Object { $_ -match $keys } |
              Select-Object -Last 25
            if (-not $errLines) { $errLines = Get-Content install.log -Tail 15 }
            foreach ($line in $errLines) {
              $escaped = ($line -replace '%', '%25') -replace "`r", '' -replace "`n", '%0A'
              if ($escaped.Trim()) { Write-Host "::error::$escaped" }
            }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## pnpm install 失败（退出码 $code）" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```' -Encoding utf8
            foreach ($line in $errLines) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line -Encoding utf8 }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```' -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 环境" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```' -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "node: $(node --version)" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "pnpm: $(pnpm --version)" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "cwd: $(Get-Location)" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```' -Encoding utf8
          }
          exit $code

      - name: 上传安装日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-log
          path: install.log
          if-no-files-found: ignore

      # 类型检查分三块：主进程/预加载、渲染层、内联内核。
      - name: 类型检查（主进程）
        run: pnpm typecheck:node

      - name: 类型检查（渲染层）
        run: pnpm typecheck:web

      - name: 类型检查（内核）
        run: pnpm typecheck:muya

      # 纯 Node 单元测试，不需要构建产物，也不需要 GUI。
      - name: 单元测试
        run: |
          node --test scripts/regression-test.js
          node --test scripts/edit-mode-toggle-test.js
          node --test scripts/reading-mode-test.js
          node --test scripts/outline-search-ci-test.js
          node --test scripts/search-results-test.js
          node --test scripts/export-options-test.js
          node --test scripts/export-preview-state-test.js
          node --test scripts/muya-hover-perf-test.js

  build:
    name: 构建
    runs-on: windows-latest
    timeout-minutes: 25
    needs: check

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
          run_install: false

      # 注意：这里不再配 git 的 insteadOf 改写。
      # 早前试过让 git 把 SSH 改写成 HTTPS，但 pnpm 拉 git 依赖时用的是
      # 自己拼的 URL，不经过 git 的 url 重写规则，那一步实际没起作用。
      # 正确做法是锁定文件本身就用 HTTPS（见 pnpm-lock.yaml 的 file-icons）。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 构建失败往往说明打包配置或引用路径有问题，及早发现。
      - name: 构建应用
        run: pnpm build
