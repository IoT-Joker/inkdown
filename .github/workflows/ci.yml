name: CI

# 只在代码或配置变化时跑，避免改文档也触发全量测试。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  workflow_dispatch:

# 同一分支的旧运行自动取消，省时间也省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查与单元测试
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 必须先装 Node：pnpm 由 Node 执行。
      # 顺序颠倒时 action-setup 的自安装脚本拿不到运行时，直接退出码 1
      # —— 这正是上一次 CI 失败的原因。
      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 用精确版本而不是 `11`：宽范围需要联网解析具体版本号，
      # 解析失败时 self-installer 会退出码 1。
      # run_install: false 避免它在装依赖前又跑一次 install。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
          run_install: false

      # 失败时 CI 界面只显示「Process completed with exit code 1」，
      # 看不到真正原因。这里先把环境与配置打印出来，便于定位。
      - name: 环境诊断
        shell: pwsh
        run: |
          Write-Host "--- node / pnpm ---"
          node --version
          pnpm --version
          Write-Host "--- pnpm 生效配置 ---"
          pnpm config list
          Write-Host "--- pnpm-workspace.yaml ---"
          Get-Content pnpm-workspace.yaml
          Write-Host "--- lockfile ---"
          Write-Host (Test-Path pnpm-lock.yaml)

      # 关键：pnpm-lock.yaml 里 file-icons 指向 SSH 形式的 git 地址
      # （git@github.com:file-icons/atom.git，来自 @marktext/file-icons 的依赖）。
      # CI 上没有 SSH 密钥，直接拉取会失败；这里让 git 把 SSH 改写成 HTTPS，
      # 公共仓库走匿名 HTTPS 即可克隆。本地因配过 SSH key 不会暴露这个问题。
      - name: 允许匿名克隆 git 依赖
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com:"
          git config --global --get-regexp "url\..*\.insteadof"

      # 先用不带 --frozen-lockfile 的方式安装。
      #
      # 输出同时落到 step summary 与 artifact：GitHub 的 annotations 只显示
      # 「Process completed with exit code 1」，job logs 接口又要更高权限的
      # token 才读得到，因此把真实输出写进公开可读的 summary。
      - name: 安装依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pnpm install --no-frozen-lockfile --reporter=default 2>&1 |
            Tee-Object -FilePath install.log
          $code = $LASTEXITCODE
          Write-Host "pnpm install 退出码: $code"
          if ($code -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## pnpm install 失败（退出码 $code）" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```' -Encoding utf8
            Get-Content install.log -Tail 150 | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```' -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 环境" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```' -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "node: $(node --version)" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "pnpm: $(pnpm --version)" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "cwd: $(Get-Location)" -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```' -Encoding utf8
          }
          exit $code

      - name: 上传安装日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          path: install.log
          if-no-files-found: ignore

      # 类型检查分三块：主进程/预加载、渲染层、内联内核。
      - name: 类型检查（主进程）
        run: pnpm typecheck:node

      - name: 类型检查（渲染层）
        run: pnpm typecheck:web

      - name: 类型检查（内核）
        run: pnpm typecheck:muya

      # 纯 Node 单元测试，不需要构建产物，也不需要 GUI。
      - name: 单元测试
        run: |
          node --test scripts/regression-test.js
          node --test scripts/edit-mode-toggle-test.js
          node --test scripts/reading-mode-test.js
          node --test scripts/outline-search-ci-test.js
          node --test scripts/search-results-test.js
          node --test scripts/export-options-test.js
          node --test scripts/export-preview-state-test.js
          node --test scripts/muya-hover-perf-test.js

  build:
    name: 构建
    runs-on: windows-latest
    timeout-minutes: 25
    needs: check

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.5
          run_install: false

      # 同 check job：锁定文件里的 git 依赖是 SSH 形式，CI 无密钥，
      # 改写成 HTTPS 才能匿名克隆。
      - name: 允许匿名克隆 git 依赖
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile --reporter=default

      # 构建失败往往说明打包配置或引用路径有问题，及早发现。
      - name: 构建应用
        run: pnpm build
